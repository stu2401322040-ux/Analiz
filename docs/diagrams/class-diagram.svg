<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="800" viewBox="0 0 1110 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1110" height="800" fill="#ffffff"/>

  <g stroke="#1a1a1a" stroke-width="1.3" fill="none">
    <line x1="180" y1="219" x2="180" y2="380"/>
    <line x1="320" y1="448" x2="440" y2="448"/>
    <polyline points="880,214 880,265 620,265 620,330"/>
    <polyline points="980,214 980,410 740,410"/>
  </g>
  <polygon points="180,195 187,207 180,219 173,207" fill="#1a1a1a"/>
  <g stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="6 4" fill="none">
    <line x1="1040" y1="214" x2="1040" y2="648" marker-end="url(#open)"/>
    <line x1="590" y1="580" x2="590" y2="648" marker-end="url(#open)"/>
  </g>

  <g font-size="13" fill="#1a1a1a">
    <text x="190" y="237">1</text>
    <text x="190" y="302" font-style="italic">съдържа</text>
    <text x="190" y="372">1..*</text>

    <text x="327" y="441">1</text>
    <text x="408" y="441">0..*</text>
    <text x="380" y="468" text-anchor="middle" font-style="italic">има</text>

    <text x="888" y="236">1</text>
    <text x="750" y="257" text-anchor="middle" font-style="italic">създава</text>
    <text x="628" y="322">0..*</text>

    <text x="988" y="236">0..1</text>
    <text x="860" y="402" text-anchor="middle" font-style="italic">потвърждава</text>
    <text x="746" y="402">0..*</text>
  </g>

  <g stroke="#1a1a1a" stroke-width="1.4">
    <rect x="40" y="40" width="280" height="32" fill="#eef2ef"/>
    <rect x="40" y="72" width="280" height="90" fill="#ffffff"/>
    <rect x="40" y="162" width="280" height="33" fill="#ffffff"/>

    <rect x="40" y="380" width="280" height="32" fill="#eef2ef"/>
    <rect x="40" y="412" width="280" height="71" fill="#ffffff"/>
    <rect x="40" y="483" width="280" height="33" fill="#ffffff"/>

    <rect x="440" y="330" width="300" height="32" fill="#eef2ef"/>
    <rect x="440" y="362" width="300" height="147" fill="#ffffff"/>
    <rect x="440" y="509" width="300" height="71" fill="#ffffff"/>

    <rect x="820" y="40" width="250" height="32" fill="#eef2ef"/>
    <rect x="820" y="72" width="250" height="109" fill="#ffffff"/>
    <rect x="820" y="181" width="250" height="33" fill="#ffffff"/>

    <rect x="440" y="650" width="300" height="44" fill="#eef2ef"/>
    <rect x="440" y="694" width="300" height="71" fill="#ffffff"/>

    <rect x="820" y="650" width="250" height="44" fill="#eef2ef"/>
    <rect x="820" y="694" width="250" height="52" fill="#ffffff"/>
  </g>

  <g font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <text x="180" y="61">Restaurant</text>
    <text x="180" y="401">RestaurantTable</text>
    <text x="590" y="351">Reservation</text>
    <text x="945" y="61">User</text>
    <text x="590" y="686">ReservationStatus</text>
    <text x="945" y="686">Role</text>
  </g>
  <g font-size="12" font-style="italic" fill="#1a1a1a" text-anchor="middle">
    <text x="590" y="667">«enumeration»</text>
    <text x="945" y="667">«enumeration»</text>
  </g>

  <g font-size="13" fill="#1a1a1a">
    <text x="50" y="92">- name : String</text>
    <text x="50" y="111">- address : String</text>
    <text x="50" y="130">- openingTime : LocalTime</text>
    <text x="50" y="149">- lastReservationTime : LocalTime</text>
    <text x="50" y="183">+ getTables() : List&lt;RestaurantTable&gt;</text>

    <text x="50" y="432">- number : int</text>
    <text x="50" y="451">- capacity : int</text>
    <text x="50" y="470">- active : boolean</text>
    <text x="50" y="504">+ isFreeAt(date, time) : boolean</text>

    <text x="450" y="382">- id : int</text>
    <text x="450" y="401">- guestName : String</text>
    <text x="450" y="420">- guestPhone : String</text>
    <text x="450" y="439">- date : LocalDate</text>
    <text x="450" y="458">- time : LocalTime</text>
    <text x="450" y="477">- guests : int</text>
    <text x="450" y="496">- status : ReservationStatus</text>
    <text x="450" y="529">+ confirm() : void</text>
    <text x="450" y="548">+ cancel() : void</text>
    <text x="450" y="567">+ change(date, time, guests) : void</text>

    <text x="830" y="92">- id : int</text>
    <text x="830" y="111">- name : String</text>
    <text x="830" y="130">- phone : String</text>
    <text x="830" y="149">- email : String</text>
    <text x="830" y="168">- role : Role</text>
    <text x="830" y="203">+ hasRole(role) : boolean</text>

    <text x="450" y="714">PENDING (очаква потвърждение)</text>
    <text x="450" y="733">CONFIRMED (потвърдена)</text>
    <text x="450" y="752">CANCELLED (отказана)</text>

    <text x="830" y="714">CLIENT (Клиент)</text>
    <text x="830" y="733">STAFF (Служител)</text>
  </g>
</svg>
